<linearGradient id="e-or" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBEBC2"/><stop offset=".35" stop-color="#E2B866"/><stop offset=".7" stop-color="#B98A2E"/><stop offset="1" stop-color="#8A6418"/></linearGradient>
<linearGradient id="e-or-h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBEBC2"/><stop offset=".5" stop-color="#D4A24A"/><stop offset="1" stop-color="#7E5A14"/></linearGradient>
