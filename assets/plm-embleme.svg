<!-- Le bois sculpté : veinage (bruit étiré), relief (flou de la forme),
     éclairage diffus puis reflet spéculaire venus du haut à gauche. -->
<filter id="e-sculpte" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.9 0.035" numOctaves="3" seed="11" result="grain"/>
  <feColorMatrix in="grain" type="matrix" values="0 0 0 0 .16  0 0 0 0 .08  0 0 0 0 .03  0 0 0 .55 0" result="veines"/>
  <feComposite in="veines" in2="SourceAlpha" operator="in" result="veinesIn"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="relief"/>
  <feDiffuseLighting in="relief" surfaceScale="7" diffuseConstant="1.15" lighting-color="#FFF4E2" result="diffus"><feDistantLight azimuth="225" elevation="48"/></feDiffuseLighting>
  <feComposite in="SourceGraphic" in2="diffus" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="eclaire"/>
  <feSpecularLighting in="relief" surfaceScale="7" specularConstant=".85" specularExponent="24" lighting-color="#FFE3B0" result="reflet"><fePointLight x="40" y="-60" z="220"/></feSpecularLighting>
  <feComposite in="reflet" in2="SourceAlpha" operator="in" result="refletIn"/>
  <feComposite in="eclaire" in2="veinesIn" operator="arithmetic" k1="0" k2="1" k3="-.55" k4="0" result="bois"/>
  <feComposite in="bois" in2="refletIn" operator="arithmetic" k1="0" k2="1" k3=".75" k4="0"/>
</filter>
<filter id="e-ombre" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="e-lueur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="f"/><feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
