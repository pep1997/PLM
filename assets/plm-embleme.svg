<linearGradient id="e-nez" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A2A12"/><stop offset=".42" stop-color="#B57A42"/><stop offset=".6" stop-color="#8A5428"/><stop offset="1" stop-color="#3A2110"/></linearGradient>
